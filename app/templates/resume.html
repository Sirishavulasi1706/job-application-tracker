{% extends "base.html" %}

{% block title %}
Resume Analyzer
{% endblock %}

{% block content %}

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-body">

            <h2 class="mb-4">
                🤖 AI Resume Analyzer
            </h2>

            <p>
                Upload your resume to analyze your skills and experience.
            </p>

            <form method="POST" enctype="multipart/form-data">

                <div class="mb-3">

                    <input
                        type="file"
                        name="resume"
                        class="form-control"
                        accept=".pdf"
                        required>

                </div>

                <button class="btn btn-primary">

                    Upload Resume

                </button>

            </form>

            {% if analysis %}

            <hr>

            <h3>🤖 AI Resume Analysis</h3>

            <div class="card mt-3">

                <div class="card-body">

                    <pre style="white-space: pre-wrap;">
{{ analysis }}
                    </pre>

                </div>

            </div>

            {% endif %}

        </div>

    </div>

</div>

{% endblock %}
