{% extends "base.html" %}

{% block title %}
Career Chat History
{% endblock %}

{% block content %}

<h2 class="fw-bold mb-4">

Career Chat History

</h2>

{% if chats %}

<div class="card shadow">

<div class="card-body">

{% for chat in chats %}

<div class="border rounded p-3 mb-4">

<h5>

You

</h5>

<p>

{{ chat.user_message }}

</p>

<hr>

<h5>

AI

</h5>

<p style="white-space:pre-wrap;">

{{ chat.ai_response }}

</p>

<a
href="{{ url_for('career_chat.delete_chat', id=chat.id) }}"
class="btn btn-danger btn-sm"
onclick="return confirm('Delete this conversation?')">

Delete

</a>

</div>

{% endfor %}

</div>

</div>

{% else %}

<div class="alert alert-info">

No conversations yet.

</div>

{% endif %}

{% endblock %}
